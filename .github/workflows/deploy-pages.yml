name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/profile_icons/**'
      - 'scripts/**'
      - '*.md'
      - '.contexts/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Production Secrets
        env:
          COUNTER_PRIMARY_GET: ${{ secrets.COUNTER_PRIMARY_GET }}
          COUNTER_PRIMARY_HIT: ${{ secrets.COUNTER_PRIMARY_HIT }}
          COUNTER_FALLBACK_GET: ${{ secrets.COUNTER_FALLBACK_GET }}
          COUNTER_FALLBACK_HIT: ${{ secrets.COUNTER_FALLBACK_HIT }}
          COUNTER_API_URL: ${{ secrets.COUNTER_API_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = {};
            let pGet = process.env.COUNTER_PRIMARY_GET;
            let pHit = process.env.COUNTER_PRIMARY_HIT;
            const apiBase = process.env.COUNTER_API_URL;

            if (!pGet && apiBase) {
              if (apiBase.includes("/get/")) {
                pGet = apiBase;
                pHit = apiBase.replace("/get/", "/hit/");
              } else {
                const base = apiBase.replace(/\/+$/, "");
                pGet = base + "/get/nuvio-latino-setup/completions";
                pHit = base + "/hit/nuvio-latino-setup/completions";
              }
            }

            if (pGet) cfg.primaryGet = pGet;
            if (pHit) cfg.primaryHit = pHit;
            if (process.env.COUNTER_FALLBACK_GET) cfg.fallbackGet = process.env.COUNTER_FALLBACK_GET;
            if (process.env.COUNTER_FALLBACK_HIT) cfg.fallbackHit = process.env.COUNTER_FALLBACK_HIT;

            if (Object.keys(cfg).length > 0) {
              console.log("Inyectando configuración de endpoints para producción...");
              const content = "export const INJECTED_COUNTER_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n";
              fs.writeFileSync("js/counter-config.js", content, "utf8");
            } else {
              console.log("Sin secretos de contador definidos.");
            }

            const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
            if (webhookUrl) {
              console.log("Inyectando configuración de Webhook de Discord para producción...");
              const webhookCfg = { webhookUrl };
              const webhookContent = "export const INJECTED_WEBHOOK_CONFIG = " + JSON.stringify(webhookCfg, null, 2) + ";\n";
              fs.writeFileSync("js/webhook-config.js", webhookContent, "utf8");
            } else {
              console.log("Sin secreto DISCORD_WEBHOOK_URL definido.");
            }

            const redisUrl = process.env.UPSTASH_REDIS_REST_URL;
            const redisToken = process.env.UPSTASH_REDIS_REST_TOKEN;
            if (redisUrl && redisToken) {
              console.log("Inyectando configuración de Upstash Redis para ranking de avatares...");
              const rankCfg = { url: redisUrl, token: redisToken };
              const rankContent = "export const INJECTED_AVATAR_RANK_CONFIG = " + JSON.stringify(rankCfg, null, 2) + ";\n";
              fs.writeFileSync("js/avatar-rank-config.js", rankContent, "utf8");
            } else {
              console.log("Sin secretos de Upstash Redis definidos.");
            }
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

