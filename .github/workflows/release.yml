name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta o versión para el lanzamiento (ej: v1.4.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Regenerate Visual Assets
        if: ${{ secrets.TMDB_API_KEY != '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_VER="${GITHUB_REF_NAME:-${{ inputs.version }}}"
          [ -z "$TARGET_VER" ] && TARGET_VER="v1.4.0"
          echo "Ejecutando pipeline de posters y social preview para versión: $TARGET_VER..."
          python scripts/update_hero_backdrop.py --version "$TARGET_VER" --quality 90

      - name: Commit and Push Updated Assets to Main
        if: ${{ secrets.TMDB_API_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets/preview/)" ]; then
            echo "Nuevos assets detectados. Realizando commit..."
            git add assets/preview/
            git commit -m "chore(assets): actualizar backdrop y social preview [skip ci]"
            git push origin HEAD:main || echo "Push no crítico a main omitido."
          else
            echo "Sin cambios en los assets de preview."
          fi

      - name: Extract Changelog Entry
        id: changelog
        shell: bash
        run: |
          TARGET_VER="${GITHUB_REF_NAME:-${{ inputs.version }}}"
          [ -z "$TARGET_VER" ] && TARGET_VER="v1.4.0"
          CLEAN_VER="${TARGET_VER#v}"
          echo "Extracting release notes for version ${CLEAN_VER}..."
          
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$CLEAN_VER" '
              BEGIN { found=0; }
              $0 ~ "^## \\[" ver "\\]" { found=1; next; }
              found && /^## \[/ { exit; }
              found { print; }
            ' CHANGELOG.md | sed -e '1{/^$/d;}' -e '${/^$/d;}' > release_notes.md
          fi

          if [ ! -s release_notes.md ]; then
            echo "Lanzamiento oficial de Nuvio Metadata Latino ${TARGET_VER}." > release_notes.md
          fi
          echo "target_tag=${TARGET_VER}" >> "$GITHUB_OUTPUT"

      - name: Create Official Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.changelog.outputs.target_tag }}"
          gh release create "$RELEASE_TAG" \
            --title "Nuvio Metadata Latino $RELEASE_TAG" \
            --notes-file release_notes.md \
            assets/preview/github-social-preview.png \
            assets/preview/incrustacion.png
