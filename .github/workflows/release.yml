name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta o versión para el lanzamiento (ej: v1.9.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Changelog Entry
        id: changelog
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(node -p "require('./version.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TARGET_VER="$GITHUB_REF_NAME"
          else
            TARGET_VER="${REQUESTED_VERSION:-v$SOURCE_VERSION}"
            TARGET_VER="v${TARGET_VER#v}"
          fi
          CLEAN_VER="${TARGET_VER#v}"
          if [ "$TARGET_VER" != "v$SOURCE_VERSION" ]; then
            echo "Release tag must match version.json" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TARGET_VER"
          awk -v header="## [$CLEAN_VER]" '
            index($0, header) == 1 { found=1; next; }
            found && /^## \[/ { exit; }
            found { print; }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "Missing changelog entry for $TARGET_VER" >&2
            exit 1
          fi
          echo "target_tag=${TARGET_VER}" >> "$GITHUB_OUTPUT"

      - name: Create Official Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.changelog.outputs.target_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Nuvio Metadata Latino $RELEASE_TAG" \
            --notes-file release_notes.md
