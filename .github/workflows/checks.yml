name: Project checks

on:
  push:
    branches: [develop]
    paths-ignore:
      - '.github/workflows/**'
      - '*.md'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '.github/workflows/**'
      - '*.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint, architecture, unit tests and build
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:dev
