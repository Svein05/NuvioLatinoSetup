<div class="story-scene" data-scene="profile" data-profile-state="created">
  <div class="scene-layer profile-picker">
    <h4>Elige el perfil</h4>
    <div class="profile-picker-row">
      <div class="profile-choice profile-svein"><img data-image-fallback="avatar" src="/assets/profile_icons/IconsStyle/Naruto/Naruto_NarutoUzumaki.webp" width="80" height="80" alt="" loading="lazy"><span>Svein</span></div>
      <div class="profile-choice"><img data-image-fallback="avatar" src="/assets/profile_icons/MangaStyle/Black%20Clover/Noelle.webp" width="80" height="80" alt="" loading="lazy"><span>Perfil 2</span></div>
      <div class="profile-choice profile-create-slot"><span class="profile-plus">+</span><img data-image-fallback="avatar" class="profile-created-avatar" src="/assets/profile_icons/IconsStyle/Black%20Clover/Asta%20(Unite).webp" width="80" height="80" alt="" loading="lazy"><span class="profile-create-label">Crear perfil</span><span class="profile-created-label">Perfil 3</span></div>
    </div>
  </div>
  <div class="profile-modal-scrim">
    <div class="scene-layer profile-create-modal">
      <h4>Crear perfil</h4>
      <p>Elige un avatar</p>
      <div class="profile-avatar-options">
        <img data-image-fallback="avatar" data-avatar-option src="/assets/profile_icons/IconsStyle/Naruto/Naruto_NarutoUzumaki.webp" width="60" height="60" alt="" loading="lazy">
        <img data-image-fallback="avatar" data-avatar-option src="/assets/profile_icons/MangaStyle/Black%20Clover/Noelle.webp" width="60" height="60" alt="" loading="lazy">
        <img data-image-fallback="avatar" data-avatar-option class="is-chosen" src="/assets/profile_icons/IconsStyle/Black%20Clover/Asta%20(Unite).webp" width="60" height="60" alt="" loading="lazy">
      </div>
      <span class="profile-name-label">Nombre del perfil</span><div class="profile-name-field"><span data-profile-name>Perfil 3</span><span class="profile-caret"></span></div>
      <span class="profile-create-action">Crear perfil</span>
    </div>
  </div>
</div>
