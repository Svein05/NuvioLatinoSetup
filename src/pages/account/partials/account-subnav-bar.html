<header class="account-subnav-bar w-full flex items-center justify-between gap-2.5 sm:gap-4 select-none">
        
        <!-- Límite Izquierdo Fijo: Perfil Activo con Popover Desplegable -->
        <div class="relative shrink-0">
          <button type="button" id="btnAccountProfileTrigger" class="lat-floating-pill px-3 flex items-center gap-2 sm:gap-2.5 bg-white/[0.05] border border-white/10 hover:border-white/25 hover:bg-white/[0.08] transition-all cursor-pointer group select-none" title="Cambiar o gestionar perfil" aria-expanded="false" aria-haspopup="true">
            <img id="sidebarActiveAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Nuvio" alt="Avatar" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border border-white/20 bg-black/40 object-cover shadow-sm shrink-0">
            <span id="sidebarActiveName" class="text-xs sm:text-sm font-semibold text-white truncate max-w-[90px] sm:max-w-[140px] md:max-w-[180px]">Cargando...</span>
            <i id="sidebarActiveChevron" class="fa-solid fa-chevron-down text-[10px] sm:text-xs text-white/50 group-hover:text-white transition-transform duration-300 ml-0.5"></i>
          </button>

          <!-- Popover Desplegable de Perfiles (Apple Glassmorphism) -->
          <div id="accountProfilePopover" class="account-profile-popover hidden absolute left-0 top-full mt-2 w-72 sm:w-80 rounded-[22px] bg-[#0c0e14]/95 border border-white/[0.14] shadow-[0_20px_50px_rgba(0,0,0,0.7)] backdrop-blur-2xl z-50 p-2.5 space-y-2 select-none">
            <div class="flex items-center justify-between px-2 pt-1 pb-1.5 border-b border-white/[0.08] text-xs text-white/60">
              <span class="font-medium">Perfiles de la cuenta</span>
              <span id="popoverProfileCount" class="font-mono text-[11px] text-white/40"></span>
            </div>

            <div id="popoverProfilesList" class="space-y-1 max-h-64 overflow-y-auto pr-0.5">
              <!-- Inyectado dinámicamente -->
            </div>

            <div id="popoverAddProfileContainer" class="pt-1 border-t border-white/[0.08]">
              <button type="button" id="btnPopoverAddProfile" class="w-full lat-capsule-btn glass text-xs py-2 px-3 flex items-center justify-center gap-1.5 text-white/80 hover:text-white border-white/10 hover:border-emerald-400/40 hover:bg-emerald-500/10 transition-all">
                <i class="fa-solid fa-plus text-emerald-400 text-[11px]"></i>
                <span>Agregar Perfil</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Zona Central Deslizable: Cápsula de Pestañas con Scroll/Drag Horizontal -->
        <div class="account-tabs-slider-wrap flex-1 min-w-0 flex items-center justify-center">
          <nav class="account-tabs-pill lat-floating-pill p-1 sm:p-1.5 flex items-center gap-1 sm:gap-1.5 text-xs sm:text-sm font-medium">
            <button type="button" class="account-nav-btn is-active shrink-0" data-section="overview" title="Resumen">
              <i class="fa-solid fa-chart-pie text-xs sm:text-sm"></i>
              <span>Resumen</span>
            </button>
            <button type="button" class="account-nav-btn shrink-0" data-section="avatars" title="Avatares">
              <i class="fa-solid fa-masks-theater text-xs sm:text-sm"></i>
              <span>Avatares</span>
            </button>
            <button type="button" class="account-nav-btn shrink-0" data-section="addons" title="Addons">
              <i class="fa-solid fa-puzzle-piece text-xs sm:text-sm"></i>
              <span>Addons</span>
            </button>
            <button type="button" class="account-nav-btn shrink-0" data-section="aiometadata" title="AIOMetadata">
              <i class="fa-solid fa-wand-magic-sparkles text-xs sm:text-sm"></i>
              <span>AIOMetadata</span>
            </button>
            <button type="button" class="account-nav-btn shrink-0" data-section="settings" title="Ajustes">
              <i class="fa-solid fa-sliders text-xs sm:text-sm"></i>
              <span>Ajustes</span>
            </button>
          </nav>
        </div>

        <!-- Límite Derecho Fijo: Cerrar Sesión -->
        <div class="shrink-0">
          <button type="button" id="btnAccountLogout" class="lat-floating-pill px-3 sm:px-4 text-xs sm:text-sm font-medium text-rose-400/90 hover:text-rose-300 hover:bg-rose-500/10 hover:border-rose-500/30 transition-all flex items-center gap-1.5 sm:gap-2 shrink-0 cursor-pointer" title="Cerrar Sesión">
            <i class="fa-solid fa-arrow-right-from-bracket text-xs sm:text-sm"></i>
            <span class="hidden md:inline">Cerrar Sesión</span>
          </button>
        </div>

      </header>
