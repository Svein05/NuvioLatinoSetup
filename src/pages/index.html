<body class="relative bg-[#08090c] text-white min-h-screen flex flex-col font-sans antialiased selection:bg-white/20 selection:text-white overflow-x-hidden">

  <!-- Barra de Navegación Flotante LAT-ADD Style -->
  <!-- @include "../shared/ui/site-shell/header.html" -->

  <!-- Hero Backdrop Cinemático de Pósters Latinos TMDB (Fixed con scroll fade) -->
  <div id="heroBackdrop" class="fixed inset-x-0 top-0 h-screen pointer-events-none overflow-hidden z-0 select-none">
    <img src="/assets/preview/hero-posters-backdrop.webp" alt="Colecciones Latinas Nuvio" class="w-full h-full object-cover object-top opacity-85 filter brightness-100 contrast-105">
    <!-- Scrim atmosférico estilo LAT-ADD: transparente arriba para ver los pósters con nitidez y fundido gradual hacia el fondo de la página -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/25 via-transparent via-35% to-[#08090c]"></div>
    <div class="absolute inset-x-0 bottom-0 h-72 bg-gradient-to-t from-[#08090c] via-[#08090c]/85 to-transparent"></div>
  </div>

  <!-- Contenedor Principal (Landing Page) -->
  <!-- @include "partials/landing/content.html" -->

  <!-- FOOTER OFICIAL NUVIO STYLE (SIN LOGO, CON CRÉDITOS)      -->
  <!-- ======================================================== -->
  <!-- @include "../shared/ui/site-shell/footer.html" -->

  <!-- Sincronización automática de versión -->

  <!-- Barra de navegación con indicador deslizante animado -->

  <!-- Inicializador del Contador Global de Configuraciones -->
  <script type="module">
    import { initCompletionsCounterUI } from '../app/completions.js';
    initCompletionsCounterUI();
  </script>
  <!-- Listener de scroll para fade progresivo de largo recorrido y atmósfera sutil -->
  <script>
    (function() {
      const backdrop = document.getElementById('heroBackdrop');
      if (!backdrop) return;
      const target = document.getElementById('como-funciona');

      let ticking = false;
      const updateBackdrop = () => {
        const scrollY = window.scrollY || window.pageYOffset;
        // Mayor recorrido de scroll para una animación pausada, fluida y cinematográfica
        const fadeEnd = target ? Math.max(600, target.offsetTop + 120) : window.innerHeight * 1.2;
        const rawProgress = Math.min(1, Math.max(0, scrollY / fadeEnd));
        // Interpolación cuadrática suave (smooth-step)
        const progress = rawProgress * rawProgress * (3 - 2 * rawProgress);

        // Transición progresiva: de 0.85 a 0.15 (más negrito, fondo tenue y profesional)
        const opacity = (0.85 - progress * 0.70).toFixed(3);
        const blurPx = (progress * 6.0).toFixed(1);
        const brightness = (1.0 - progress * 0.45).toFixed(2);

        backdrop.style.opacity = opacity;
        backdrop.style.filter = `blur(${blurPx}px) brightness(${brightness})`;
        ticking = false;
      };

      window.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(updateBackdrop);
          ticking = true;
        }
      }, { passive: true });

      updateBackdrop();
    })();
  </script>
</body>
