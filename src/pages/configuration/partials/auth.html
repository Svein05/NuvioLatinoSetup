<div id="step-1" class="step-content active">
        <div class="flex-1 flex flex-col justify-center items-center w-full min-h-[50vh] py-4">
          <div class="w-full max-w-md mx-auto space-y-5">
            <div class="mb-4 text-center">
              <h2 id="authHeading" class="text-2xl sm:text-3xl font-normal font-serif text-white flex items-center justify-center">
                <span id="authHeadingText">Conectar con tu cuenta de Nuvio</span>
              </h2>
              <p class="text-xs text-white/60 mt-1.5">Accede para sincronizar directamente con tus perfiles oficiales</p>
            </div>

            <!-- Pestañas de Modo: Iniciar Sesión vs Crear Cuenta -->
            <div id="authPillContainer" class="auth-pill-container p-1 bg-white/[0.04] border border-white/[0.08] rounded-full shadow-[var(--brillo-vidrio)] flex items-center">
              <div id="authPillIndicator" class="auth-pill-indicator"></div>
              <button id="tabAuthLogin" type="button" class="relative z-10 flex-1 py-2 px-3 rounded-full text-xs font-semibold text-[#08090c] transition-colors duration-200 flex items-center justify-center gap-1.5 focus:outline-none">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>Iniciar Sesión</span>
              </button>
              <button id="tabAuthSignup" type="button" class="relative z-10 flex-1 py-2 px-3 rounded-full text-xs font-medium text-white/60 hover:text-white transition-colors duration-200 flex items-center justify-center gap-1.5 focus:outline-none">
                <i class="fa-solid fa-user-plus"></i>
                <span>Crear Cuenta</span>
              </button>
            </div>

            <form id="authForm" onsubmit="event.preventDefault();" class="space-y-4">
              <div>
                <label class="lat-label block mb-2">Correo Electrónico</label>
                <input id="nuvioEmail" type="email" placeholder="usuario@correo.com" autocomplete="email" class="w-full px-4 py-3 rounded-[16px] bg-white/[0.04] border border-white/[0.12] focus:outline-none focus:border-white/40 focus:ring-2 focus:ring-white/10 text-sm text-white placeholder:text-white/30 shadow-[var(--brillo-vidrio)] transition-all">
              </div>
              <div>
                <label class="lat-label block mb-2">Contraseña</label>
                <div class="relative">
                  <input id="nuvioPassword" type="password" placeholder="••••••••" autocomplete="current-password" class="w-full px-4 py-3 pr-10 rounded-[16px] bg-white/[0.04] border border-white/[0.12] focus:outline-none focus:border-white/40 focus:ring-2 focus:ring-white/10 text-sm text-white placeholder:text-white/30 shadow-[var(--brillo-vidrio)] transition-all">
                  <button id="btnToggleNuvioPassword" type="button" class="btn-toggle-key absolute right-3 top-1/2 -translate-y-1/2 text-white/40 hover:text-white p-1 transition-colors cursor-pointer z-10" data-target="nuvioPassword" title="Mostrar contraseña">
                    <i class="fa-solid fa-eye-slash text-xs pointer-events-none"></i>
                  </button>
                </div>
                <p id="authHintText" class="text-[11px] text-white/50 mt-1.5 hidden flex items-center gap-1">
                  <i class="fa-solid fa-shield text-emerald-400"></i>
                  <span>La contraseña debe contener al menos 6 caracteres.</span>
                </p>
              </div>

              <!-- Confirmar Contraseña (Solo en Modo Crear Cuenta) -->
              <div id="confirmPasswordGroup" class="hidden space-y-1.5">
                <label class="lat-label block mb-1">Confirmar Contraseña</label>
                <div class="relative">
                  <input id="nuvioPasswordConfirm" type="password" placeholder="Repite tu contraseña" autocomplete="new-password" class="w-full px-4 py-3 pr-10 rounded-[16px] bg-white/[0.04] border border-white/[0.12] focus:outline-none focus:border-white/40 focus:ring-2 focus:ring-white/10 text-sm text-white placeholder:text-white/30 shadow-[var(--brillo-vidrio)] transition-all">
                  <button id="btnToggleNuvioPasswordConfirm" type="button" class="btn-toggle-key absolute right-3 top-1/2 -translate-y-1/2 text-white/40 hover:text-white p-1 transition-colors cursor-pointer z-10" data-target="nuvioPasswordConfirm" title="Mostrar contraseña">
                    <i class="fa-solid fa-eye-slash text-xs pointer-events-none"></i>
                  </button>
                </div>
                <p id="passwordMatchBadge" class="text-[11px] text-white/50 mt-1 hidden flex items-center gap-1 font-medium"></p>
              </div>

              <!-- Botón Iniciar Sesión -->
              <button id="btnNuvioConnect" type="submit" class="w-full py-3 px-4 rounded-full bg-white text-[#08090c] hover:bg-white/90 font-medium text-sm transition-all shadow-[var(--shadow-pill)] flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>Conectar Cuenta</span>
              </button>

              <!-- Botón Crear Cuenta (Oculto por defecto) -->
              <button id="btnNuvioSignup" type="submit" class="w-full py-3 px-4 rounded-full bg-white text-[#08090c] hover:bg-white/90 font-medium text-sm transition-all shadow-[var(--shadow-pill)] hidden items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i>
                <span>Crear Cuenta en Nuvio</span>
              </button>
            </form>

            <!-- Opción Alternativa: Modo Manual sin cuenta -->
            <div class="relative flex py-2 items-center">
              <div class="flex-grow border-t border-white/[0.08]"></div>
              <span class="flex-shrink mx-3 text-[10px] text-white/40 uppercase tracking-widest font-mono">o también</span>
              <div class="flex-grow border-t border-white/[0.08]"></div>
            </div>

            <button id="btnContinueWithoutAccount" type="button" class="w-full py-3 px-4 rounded-full bg-white/[0.05] hover:bg-white/[0.1] border border-white/[0.1] text-white/80 hover:text-white text-xs font-medium transition-all shadow-[var(--brillo-vidrio)] flex items-center justify-center gap-2">
              <i class="fa-solid fa-user-slash text-white/50"></i>
              <span>Continuar sin cuenta de Nuvio (Modo Manual)</span>
            </button>

            <!-- Clave pública interna oculta para producción -->
            <input id="nuvioApikey" type="hidden" value="sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN">

            <div class="p-3.5 bg-white/[0.03] border border-white/[0.08] rounded-[16px] flex items-center justify-center text-center gap-2.5 text-xs text-white/60 shadow-[var(--brillo-vidrio)]">
              <i class="fa-solid fa-lock text-white/40 text-xs shrink-0"></i>
              <span>Tus credenciales se envían directamente a Nuvio. No se guardan ni transmiten a terceros.</span>
            </div>
          </div>
        </div>
      </div>
