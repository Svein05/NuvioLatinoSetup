<div id="modalStremioMigration" class="fixed inset-0 z-[80] hidden items-center justify-center p-4 bg-black/70 backdrop-blur-md" aria-labelledby="migrationTitle">
  <div class="migration-dialog lat-card w-full max-w-xl p-5 sm:p-7 relative">
    <button id="btnCancelMigration" type="button" class="migration-close" aria-label="Cerrar importación"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    <div class="migration-brand mb-4" aria-label="Stremio">
      <img src="../../../assets/logo/stremio-symbol.png" alt="" width="48" height="48" />
      <img src="../../../assets/logo/stremio-wordmark.png" alt="Stremio" width="334" height="43" />
    </div>
    <h2 id="migrationTitle" class="font-serif text-3xl pr-8">¿Vienes de Stremio?</h2>
    <div data-migration-panel="choice" class="space-y-5 mt-4">
      <p class="text-sm text-white/70">Trae tus addons, biblioteca y estados de reproducción al perfil que elijas en Nuvio.</p>
      <div class="flex flex-col gap-3">
        <button type="button" data-migration-action="login" class="lat-capsule-btn solid">Importar desde Stremio</button>
        <button type="button" data-migration-action="skip" class="lat-capsule-btn glass">Continuar con Nuvio</button>
      </div>
    </div>
    <div data-migration-panel="manual" class="hidden space-y-4 mt-4">
      <p class="text-sm text-white/70">Para guardar tus datos de Stremio necesitas conectar tu cuenta de Nuvio y elegir un perfil.</p>
      <button type="button" data-migration-action="connect" class="lat-capsule-btn solid w-full">Conectar Nuvio</button>
      <button type="button" data-migration-action="manual" class="lat-capsule-btn glass w-full">Omitir importación y usar modo manual</button>
    </div>
  </div>
</div>
