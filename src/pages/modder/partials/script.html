<script type="module">
    import { 
      modderState, 
      stagedState,
      getModderSession, 
      clearModderSession, 
      populateSelects, 
      handleFiles, 
      renderQueue, 
      stageBatchUpload,
      updateStep2Visibility,
      renderCatalogGrid,
      closeCollectionDetail,
      closeEditModal,
      handleReplacementImage,
      stageAvatarUpdate,
      stageAvatarDelete,
      undoLastChange,
      commitAllStagedChanges,
      updateStagedUI,
      openPublishModal,
      closePublishModal,
      executePublishStagedChanges,
      refreshCatalogFromGitHub
    } from '../../../js/modder-uploader.js?v=1.8.8';

    // Verificación de Acceso Secreto: Si no hay sesión válida proveniente de /account, redirigir
    const activeSession = getModderSession();
    if (!activeSession || !activeSession.token) {
      window.location.replace('../account/');
      throw new Error('Acceso no autorizado.');
    }

    modderState.token = activeSession.token;
    modderState.email = activeSession.email;

    const btnLogout = document.getElementById('btnLogoutModder');
    const tabBtnUpload = document.getElementById('tabBtnUpload');
    const tabBtnManage = document.getElementById('tabBtnManage');
    const sectionUpload = document.getElementById('sectionUpload');
    const sectionManage = document.getElementById('sectionManage');

    // Cambiar entre Pestañas Subir Nuevos y Gestionar Existentes
    function switchTab(tab) {
      modderState.activeTab = tab;
      if (tab === 'upload') {
        tabBtnUpload.className = 'flex-1 sm:flex-initial flex items-center justify-center gap-2 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all bg-white/[0.12] text-white whitespace-nowrap';
        tabBtnManage.className = 'flex-1 sm:flex-initial flex items-center justify-center gap-2 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all text-white/60 hover:text-white whitespace-nowrap';
        sectionUpload.classList.remove('hidden');
        sectionManage.classList.add('hidden');
      } else {
        tabBtnManage.className = 'flex-1 sm:flex-initial flex items-center justify-center gap-2 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all bg-white/[0.12] text-white whitespace-nowrap';
        tabBtnUpload.className = 'flex-1 sm:flex-initial flex items-center justify-center gap-2 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all text-white/60 hover:text-white whitespace-nowrap';
        sectionManage.classList.remove('hidden');
        sectionUpload.classList.add('hidden');
        renderCatalogGrid();
      }
    }

    if (tabBtnUpload) tabBtnUpload.addEventListener('click', () => switchTab('upload'));
    if (tabBtnManage) tabBtnManage.addEventListener('click', () => switchTab('manage'));

    // Logout
    if (btnLogout) {
      btnLogout.addEventListener('click', () => {
        clearModderSession();
        window.location.replace('../account/');
      });
    }

    async function init() {
      await populateSelects();
      renderCatalogGrid();
      updateStagedUI();
    }

    // Selección de Estilos y Franquicias en Uploader (Paso 1)
    const selectStyle = document.getElementById('selectStyle');
    if (selectStyle) {
      selectStyle.addEventListener('change', () => {
        modderState.selectedStyle = selectStyle.value;
        updateStep2Visibility();
        renderQueue();
      });
    }

    const selectFranchise = document.getElementById('selectFranchise');
    const inputNewFranchise = document.getElementById('inputNewFranchise');
    if (selectFranchise && inputNewFranchise) {
      selectFranchise.addEventListener('change', () => {
        if (selectFranchise.value === '__NEW__') {
          inputNewFranchise.classList.remove('hidden');
          inputNewFranchise.focus();
          modderState.isNewFranchise = true;
        } else {
          inputNewFranchise.classList.add('hidden');
          modderState.isNewFranchise = false;
          modderState.selectedFranchise = selectFranchise.value;
        }
        updateStep2Visibility();
        renderQueue();
      });

      inputNewFranchise.addEventListener('input', () => {
        updateStep2Visibility();
        renderQueue();
      });
    }

    // File Input Uploader
    const fileInput = document.getElementById('fileInput');
    if (fileInput) {
      fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
        fileInput.value = '';
      });
    }

    // Vaciar cola temporal
    const btnClearQueue = document.getElementById('btnClearQueue');
    if (btnClearQueue) {
      btnClearQueue.addEventListener('click', () => {
        modderState.filesQueue = [];
        renderQueue();
        updateStagedUI();
      });
    }

    // Añadir tanda a cambios pendientes
    const btnSubmit = document.getElementById('btnSubmitBatch');
    if (btnSubmit) {
      btnSubmit.addEventListener('click', stageBatchUpload);
    }

    // Botones Globales: Deshacer y Guardar Cambios
    const btnUndo = document.getElementById('btnUndoChange');
    if (btnUndo) {
      btnUndo.addEventListener('click', undoLastChange);
    }

    const btnSaveAll = document.getElementById('btnSaveAllChanges');
    if (btnSaveAll) {
      btnSaveAll.addEventListener('click', commitAllStagedChanges);
    }

    // Filtros de Catálogo Existente (Colecciones)
    const manageSearchInput = document.getElementById('manageSearchInput');
    if (manageSearchInput) {
      manageSearchInput.addEventListener('input', (e) => {
        modderState.catalogFilters.query = e.target.value;
        renderCatalogGrid();
      });
    }

    const manageStyleSelect = document.getElementById('manageStyleSelect');
    if (manageStyleSelect) {
      manageStyleSelect.addEventListener('change', (e) => {
        modderState.catalogFilters.style = e.target.value;
        modderState.activeCollection = null; // Regresar al nivel de colecciones
        populateSelects();
        renderCatalogGrid();
      });
    }

    const btnRefreshCatalog = document.getElementById('btnRefreshCatalog');
    if (btnRefreshCatalog) {
      btnRefreshCatalog.addEventListener('click', refreshCatalogFromGitHub);
    }

    const btnRefreshDetailCatalog = document.getElementById('btnRefreshDetailCatalog');
    if (btnRefreshDetailCatalog) {
      btnRefreshDetailCatalog.addEventListener('click', refreshCatalogFromGitHub);
    }

    // Navegación de Detalle de Colección (Nivel 2)
    const btnBackToCollections = document.getElementById('btnBackToCollections');
    if (btnBackToCollections) {
      btnBackToCollections.addEventListener('click', closeCollectionDetail);
    }

    const detailSearchInput = document.getElementById('detailSearchInput');
    if (detailSearchInput) {
      detailSearchInput.addEventListener('input', (e) => {
        modderState.detailSearchQuery = e.target.value;
        renderCatalogGrid();
      });
    }

    // Modal Events
    const btnModalClose = document.getElementById('btnModalClose');
    const btnModalCancel = document.getElementById('btnModalCancel');
    if (btnModalClose) btnModalClose.addEventListener('click', closeEditModal);
    if (btnModalCancel) btnModalCancel.addEventListener('click', closeEditModal);

    const modalFileInput = document.getElementById('modalFileInput');
    if (modalFileInput) {
      modalFileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          handleReplacementImage(e.target.files[0]);
        }
      });
    }

    const btnModalSave = document.getElementById('btnModalSave');
    if (btnModalSave) btnModalSave.addEventListener('click', stageAvatarUpdate);

    const btnModalDelete = document.getElementById('btnModalDelete');
    if (btnModalDelete) btnModalDelete.addEventListener('click', stageAvatarDelete);

    // Eventos del Modal de Publicación en GitHub (Progreso y Logs)
    const btnPublishModalClose = document.getElementById('btnPublishModalClose');
    if (btnPublishModalClose) btnPublishModalClose.addEventListener('click', closePublishModal);

    const btnCancelPublish = document.getElementById('btnCancelPublish');
    if (btnCancelPublish) btnCancelPublish.addEventListener('click', closePublishModal);

    const btnConfirmPublish = document.getElementById('btnConfirmPublish');
    if (btnConfirmPublish) btnConfirmPublish.addEventListener('click', executePublishStagedChanges);

    init();
  </script>
