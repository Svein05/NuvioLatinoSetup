<div id="editAvatarModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
      <div class="lat-card p-6 sm:p-8 w-full max-w-xl space-y-5 text-left border border-white/20 shadow-2xl relative">
        
        <div class="flex items-center justify-between border-b border-white/10 pb-3">
          <h3 class="text-lg font-serif text-white flex items-center gap-2">
            <i class="fa-solid fa-pen-ruler text-amber-300 text-sm"></i>
            <span>Editar Asset Existente</span>
          </h3>
          <button id="btnModalClose" type="button" class="text-white/40 hover:text-white text-sm p-1">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Vista previa actual -->
        <div class="flex items-center gap-4 bg-white/[0.02] border border-white/10 p-3 rounded-xl">
          <div class="w-20 h-20 rounded-xl overflow-hidden bg-white/5 border border-white/10 shrink-0">
            <img id="modalAvatarPreview" src="" alt="Avatar actual" class="w-full h-full object-cover">
          </div>
          <div class="text-xs space-y-1 overflow-hidden">
            <div class="text-white/50 text-[10px] font-mono truncate" id="modalInfoPath"></div>
            <div><span class="text-white/50">Estilo:</span> <strong id="modalInfoStyle" class="text-white/90"></strong></div>
            <div><span class="text-white/50">Obra / Colección:</span> <strong id="modalInfoFranchise" class="text-white/90"></strong></div>
          </div>
        </div>

        <!-- Campo para Renombrar Personaje (Sin extensión .webp editable) -->
        <div class="space-y-1.5">
          <label class="text-xs text-white/70 block font-medium">Nombre del Personaje</label>
          <div class="flex items-center gap-2">
            <input type="text" id="modalCharacterInput" class="lat-field w-full text-xs py-2 font-mono" placeholder="ej: Noelle (Valkyrie)">
            <span class="text-xs font-mono text-white/40 shrink-0 px-2.5 py-2 bg-white/[0.05] border border-white/10 rounded-xl">.webp</span>
          </div>
          <p class="text-[11px] text-white/40">Se guardará automáticamente como archivo .webp en la carpeta de la colección.</p>
        </div>

        <!-- Reemplazo de Imagen -->
        <div class="space-y-2">
          <label class="text-xs text-white/70 block font-medium">Reemplazar Imagen (Opcional)</label>
          <div class="border border-dashed border-white/20 hover:border-amber-400/50 p-3 rounded-xl text-center relative cursor-pointer bg-white/[0.01]">
            <input type="file" id="modalFileInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
            <span class="text-xs text-white/60">Haz clic o arrastra una nueva imagen para sobreescribir</span>
          </div>

          <!-- Previsualización de Reemplazo si se selecciona -->
          <div id="modalReplacementPreview" class="hidden flex items-center gap-3 p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-xs">
            <img id="modalReplacementImg" src="" alt="Nueva imagen" class="w-12 h-12 rounded-lg object-cover">
            <span class="text-emerald-400">Nueva imagen lista en formato WebP</span>
          </div>
        </div>

        <!-- Estado / Feedback -->
        <div id="modalEditStatus" class="text-xs text-center min-h-[18px]"></div>

        <!-- Botones de Acción (Contenidos estrictamente dentro de los bordes) -->
        <div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 pt-3 border-t border-white/10">
          <button id="btnModalDelete" type="button" class="text-xs text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 px-3.5 py-2 rounded-xl transition-colors flex items-center gap-1.5 cursor-pointer shrink-0" title="Marcar este avatar para eliminar en los cambios pendientes">
            <i class="fa-solid fa-trash-can"></i>
            <span>Marcar para Eliminar</span>
          </button>

          <div class="flex items-center gap-2 shrink-0">
            <button id="btnModalCancel" type="button" class="lat-capsule-btn outline text-xs px-4 py-2">
              Cancelar
            </button>
            <button id="btnModalSave" type="button" class="lat-capsule-btn solid text-xs px-4 py-2 font-semibold flex items-center justify-center gap-1.5" title="Guardar edición en la lista de cambios pendientes">
              <i class="fa-solid fa-check text-emerald-400"></i>
              <span>Aplicar Cambios</span>
            </button>
          </div>
        </div>

      </div>
    </div>
