<header class="lat-floating-nav">
    <!-- Cápsula Izquierda: Marca (Compacta en móvil/tablet < 1080px, extendida en desktop >= 1080px) -->
    <a href="{{ site.href-index }}" class="lat-floating-pill px-2.5 sm:px-4 lg:px-5 flex items-center gap-2 transition-all hover:bg-white/[0.12] group shrink-0" title="{{ site.brand-title }}">
      <img src="https://nuvio.tv/assets/nuvio-app-logo-wordmark.webp" alt="Nuvio" class="h-5 sm:h-7 w-auto object-contain transition-transform group-hover:scale-105">
      <span class="lat-brand-text text-sm sm:text-[15px] font-semibold tracking-wide text-white">Metadata Latino</span>
      <span class="lat-brand-badge app-version-badge text-[10px] sm:text-[11px] px-2 sm:px-2.5 py-0.5 rounded-full bg-white/[0.08] text-white/80 border border-white/10 font-mono">v1.8.0</span>
    </a>

    <!-- Cápsula Central: Segmented Tabs (Solo íconos en móvil, texto en sm:) -->
    <nav class="lat-floating-pill p-1 sm:p-1.5 flex items-center gap-1 sm:gap-2 text-xs sm:text-sm font-medium">
      <a href="{{ site.href-index }}" class="lat-nav-tab{{ site.active-index }}" aria-current="{{ site.current-index }}" aria-label="Inicio" title="Inicio">
        <i class="fa-solid fa-house text-xs sm:text-sm"></i>
        <span class="hidden sm:inline">Inicio</span>
      </a>
      <a href="{{ site.href-configuration }}" class="lat-nav-tab{{ site.active-configuration }}" aria-current="{{ site.current-configuration }}" aria-label="Asistente" title="Asistente">
        <i class="fa-solid fa-wand-magic-sparkles text-xs sm:text-sm"></i>
        <span class="hidden sm:inline">Asistente</span>
      </a>
      <a href="{{ site.href-account }}" class="lat-nav-tab{{ site.active-account }}" aria-current="{{ site.current-account }}" aria-label="Cuenta" title="Cuenta">
        <i class="fa-solid fa-circle-user text-xs sm:text-sm"></i>
        <span class="hidden sm:inline">Cuenta</span>
      </a>
      <a href="{{ site.href-documentation }}" class="lat-nav-tab{{ site.active-documentation }}" aria-current="{{ site.current-documentation }}" aria-label="Documentación" title="Documentación">
        <i class="fa-solid fa-book-open text-xs sm:text-sm"></i>
        <span class="hidden sm:inline">Documentación</span>
      </a>
    </nav>

    <!-- Cápsula Derecha Móvil / Tablet (< 1080px o desborde): Cápsula Circular con Dropdown Vertical -->
    <div class="relative pointer-events-auto shrink-0 lat-mobile-nav-cluster">
      <button id="btnMobileHeaderMenu"
              type="button"
              class="lat-floating-pill flex items-center justify-center text-white/80 hover:text-white transition-all cursor-pointer"
              title="Enlaces Rápidos y Contador"
              aria-label="Abrir enlaces rápidos">
        <i class="fa-solid fa-layer-group text-sm"></i>
      </button>

      <!-- Dropdown Flotante Vertical hacia Abajo (Efecto Glass) -->
      <div id="mobileHeaderDropdown" class="lat-mobile-dropdown">
        <div class="lat-mobile-dropdown-item completions-counter-pill text-emerald-400 font-mono font-semibold" title="Setups Completados">
          <i class="fa-solid fa-users text-emerald-400 text-xs"></i>
          <span class="completions-count-compact text-xs">--</span>
        </div>
        <a href="https://discord.gg/EubYtJVJEc" target="_blank" rel="noopener noreferrer"
           class="lat-mobile-dropdown-item text-[#a5b4fc] hover:text-white" title="Comunidad Discord LAT-ADD">
          <i class="fa-brands fa-discord text-sm text-[#5865F2]"></i>
        </a>
        <a href="https://github.com/Svein05/NuvioLatinoSetup" target="_blank" rel="noopener noreferrer"
           class="lat-mobile-dropdown-item text-white/80 hover:text-white" title="Repositorio en GitHub">
          <i class="fa-brands fa-github text-sm"></i>
        </a>
      </div>
    </div>

    <!-- Cápsula Derecha Desktop (>= 1080px): Contador + Discord + GitHub -->
    <div class="lat-desktop-nav-cluster items-center gap-1.5 sm:gap-2 pointer-events-auto shrink-0">
      <!-- Pastilla Dinámica: Contador de Setups Completados -->
      <div id="completionsCounterPill"
           class="lat-floating-pill completions-counter-pill px-2.5 sm:px-4 text-xs sm:text-sm font-medium flex items-center gap-1.5 cursor-pointer group select-none text-emerald-400 shrink-0 hover:bg-white/[0.12]"
           title="Setups Completados">
        <i class="fa-solid fa-users text-sm sm:text-base text-emerald-400 group-hover:scale-105 transition-all duration-200 shrink-0"></i>
        
        <!-- Número Compacto en Reposo (ej: 150, 1.5k, 2M) -->
        <span class="completions-count-compact font-mono font-semibold text-emerald-400 shrink-0">--</span>

        <!-- Bloque Expandible en Hover (Solo en Desktop >= 1024px) -->
        <div class="completions-expanded-wrap">
          <span class="completions-count-full font-mono font-semibold text-emerald-400 shrink-0">--</span>
          <span class="text-emerald-400/90 font-normal text-xs sm:text-sm tracking-tight whitespace-nowrap">
            Setups Completados
          </span>
        </div>
      </div>

      <a href="https://discord.gg/EubYtJVJEc" target="_blank" rel="noopener noreferrer" 
         class="lat-floating-pill px-2.5 sm:px-4 text-xs sm:text-sm font-medium text-[#a5b4fc] hover:text-white hover:bg-white/[0.12] flex items-center gap-1.5" title="Comunidad Discord LAT-ADD">
        <i class="fa-brands fa-discord text-sm sm:text-base text-[#5865F2]"></i>
        <span class="hidden sm:inline">LAT-ADD</span>
      </a>

      <a href="https://github.com/Svein05/NuvioLatinoSetup" target="_blank" rel="noopener noreferrer" 
         class="lat-floating-pill px-2.5 sm:px-3.5 text-xs sm:text-sm font-medium text-white/80 hover:text-white hover:bg-white/[0.12] flex items-center gap-2 group select-none" title="Repositorio en GitHub • Ver estrellas">
        <div class="flex items-center gap-1.5">
          <i class="fa-brands fa-github text-sm sm:text-base"></i>
          <span class="hidden sm:inline">GitHub</span>
        </div>
        <span class="h-3.5 w-px bg-white/20 my-auto shrink-0" aria-hidden="true"></span>
        <div class="flex items-center gap-1 font-mono text-[11px] sm:text-xs text-amber-300/90 group-hover:text-amber-200">
          <i class="fa-solid fa-star text-[10px] text-[#ffd479]"></i>
          <span class="github-stars-count font-semibold">3</span>
        </div>
      </a>
    </div>
  </header>
